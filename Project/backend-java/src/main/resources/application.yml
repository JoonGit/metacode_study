server:
  servlet:
    context-path: /

spring:
  application:
    name: smartorder-backend

  jackson:
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    username: smartorder
    password: smartorder
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.OracleDialect
